DIFFICULTY: 5
PLAYER_COUNT: 1
PLAYER_CREATE_DEFAULT: true
PLAYER_SHIP_RESPAWN: false
EPADD_ENABLED: true

# Seconds after map start to beam down WITHOUT taking orbit. 0 = off, which is the game;
# a headless --test sets it so the away half is actually exercised.
LP_AUTO_BEAM: 0

# Minutes of night left once the party is on the ground.
LP_DAWN_MINUTES: 40

# Skill checks: "dice" (d10 + skill + help) or "flat" (5 + skill + help, no luck).
LP_CHECK_MODE: dice
# Fix the dice for a repeatable run. 0 = unseeded.
LP_SEED: 0

# Art sets drawn over the mission's own `builtin` art, in order (see sbs_utils
# tilemap_art.py). `frontier` is the Cosmos-Tiles frontier pack; without the pack the
# builtin art is used.
TILE_ART: frontier

PLAYER_LIST:
    -   name: "Artemis"
        side: "tsn"
        ship: "tsn_light_cruiser"
        face: "terran"
    -   name: "Intrepid"
        side: "tsn"
        ship: "tsn_battle_cruiser"
        face: "terran"

DOCKING:
    refuel_amount: 20
    refuel_delay: 2
    shield_delay: 2
    shield_coeff: 2
    torps_delay: 6
    interior_delay: 2
    interior_count: 2
